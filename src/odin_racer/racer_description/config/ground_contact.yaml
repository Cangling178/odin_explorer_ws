# Initial engineering values for Gazebo Classic 11 / ODE, not measurements.
# This file is read by the contact-world generator, not as ROS node parameters.
physics:
  step_size_s: 0.001
  update_rate_hz: 1000.0
  solver_iterations: 80
  sor: 1.3
contact:
  stiffness_n_per_m: 100000.0
  damping_ns_per_m: 100.0
  min_depth_m: 0.0001
  max_correcting_velocity_mps: 0.1
  max_contacts: 10
friction:
  tire: 0.8
  ball: 0.02
  body: 0.5
  ground: 1.0
# Free wheels with small numerical/mechanical damping; no motor brake or drive.
wheel_joint_damping_nms_per_rad: 0.0001
# Drop from 20 mm above the lowest collision; ground is world Z=0.
initial_clearance_m: 0.02
