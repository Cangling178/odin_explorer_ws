# Runtime ROS controller configuration; simulation only.
# Wheel geometry is injected from the expanded URDF at launch.
/sim/racer/controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
/sim/racer/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    joints: [left_wheel_joint, right_wheel_joint]
    interfaces: [position, velocity, effort]
    use_local_topics: false
/sim/racer/diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheels_per_side: 1
    # Simulator-only fit: measured wheel-derived yaw / world yaw was ~1.101
    # in both in-place directions and an arc with the current cylinder contacts.
    # Nominal CAD track stays 0.257 m; recalibrate for other tires/ground/hardware.
    wheel_separation_multiplier: 1.10
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    tf_frame_prefix_enable: false
    enable_odom_tf: true
    position_feedback: true
    open_loop: false
    use_stamped_vel: true
    cmd_vel_timeout: 0.25
    publish_limited_velocity: true
    velocity_rolling_window_size: 5
    # Uncalibrated initial covariance; not a hardware accuracy claim.
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.2
    linear.x.min_velocity: -0.2
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.3
    linear.x.min_acceleration: -0.3
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 1.5
    angular.z.min_acceleration: -1.5
