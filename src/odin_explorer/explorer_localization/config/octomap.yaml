# Starter settings for manually moved, level-floor laboratory mapping.
# Height bounds are supplied by the launch from the measured floor_z.
octomap_server:
  ros__parameters:
    resolution: 0.05
    frame_id: odom
    base_frame_id: lidar
    sensor_model.max_range: 5.0
    sensor_model.hit: 0.7
    sensor_model.miss: 0.4
    sensor_model.min: 0.12
    sensor_model.max: 0.97
    # No calibrated base_footprint exists yet. Do not use its ground-plane filter.
    filter_ground_plane: false
    filter_speckles: false
    compress_map: true
    incremental_2D_projection: false
    latch: true

odin_cloud_gate:
  ros__parameters:
    sensor_frame: lidar
    map_frame: odom
    odom_frame: odom
    max_rate: 5.0
    max_cloud_age: 0.5
    future_tolerance: 0.1
    # Active only with a separate mapping frame, e.g. mapping_frame:=map.
    # Relative to the first accepted map/odom transform, not just the last frame.
    correction_translation_limit: 0.15
    correction_rotation_limit: 0.10
