name: Scaffold checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Trust workspace for Git commands in container
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install check and asset build dependencies
        run: |
          apt-get update
          apt-get install -y python3-yaml python3-numpy python3-colcon-common-extensions ros-humble-xacro ros-humble-robot-state-publisher ros-humble-joint-state-publisher ros-humble-gazebo-dev ros-humble-gazebo-ros ros-humble-sensor-msgs ros-humble-cv-bridge ros-humble-tf2-ros ros-humble-nav-msgs ros-humble-std-srvs ros-humble-ament-cmake-gtest libopencv-dev libeigen3-dev python3-scipy python3-opencv ros-humble-rosidl-default-generators
      - name: Check repository and offline behavior
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          python3 tools/check_workspace.py
          python3 -m unittest discover -s tests -v
      - name: Build package assets and simulation plugin
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths src
      - name: Test C++ perception and tracking
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/local_setup.bash
          colcon test --base-paths src --packages-select racer_perception racer_control
          colcon test-result --verbose
